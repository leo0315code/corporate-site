name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（语法 + PHPUnit）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo, json
          coverage: none

      - name: 安装依赖
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 语法检查（app / config / route / tests）
        run: |
          set -e
          find app config route tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
          echo "语法检查通过"

      - name: 运行 PHPUnit（sqlite，不依赖 MySQL）
        run: php vendor/bin/phpunit --no-coverage

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 生产构建
        run: npm run build
